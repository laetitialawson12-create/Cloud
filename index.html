<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Tâches Avancée</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1>Mes Tâches ✨</h1>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Ajouter une nouvelle tâche...">
            <select id="tagSelect">
                <option value="💻 Travail">💻 Travail</option>
                <option value="🏠 Perso">🏠 Perso</option>
                <option value="🚨 Urgent">🚨 Urgent</option>
            </select>
            <button id="addBtn">Ajouter</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">Toutes</button>
            <button class="filter-btn" data-filter="active">En cours</button>
            <button class="filter-btn" data-filter="completed">Terminées</button>
        </div>

        <ul id="taskList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
